name: Build XP-static (MinGW-w64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - { msystem: MINGW32, arch: i686,   triplet: i686-w64-mingw32,   toolchain: cmake/toolchain-mingw32-xp.cmake,  subsys: "5.01", tag: winxp-x86 }
          - { msystem: MINGW64, arch: x86_64, triplet: x86_64-w64-mingw32, toolchain: cmake/toolchain-mingw64-xp.cmake,  subsys: "5.02", tag: winxp-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.target.msystem }}
          update: true
          install: >-
            base-devel
            git
            ninja
            ${{ format('mingw-w64-{0}-gcc', matrix.target.arch) }}
            ${{ format('mingw-w64-{0}-cmake', matrix.target.arch) }}
            ${{ format('mingw-w64-{0}-ninja', matrix.target.arch) }}
            ${{ format('mingw-w64-{0}-binutils', matrix.target.arch) }} 

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build-${{ matrix.target.tag }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.target.toolchain }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-${{ matrix.target.tag }} --config Release --parallel

      - name: Show imports (optional)
        shell: msys2 {0}
        run: |
          ${{ matrix.target.triplet }}-objdump -p build-${{ matrix.target.tag }}/hotaDatConverter.exe | sed -n '/DLL Name/p;/DLL characteristics/p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotaDatConverter-${{ matrix.target.tag }}
          path: build-${{ matrix.target.tag }}/hotaDatConverter.exe
          if-no-files-found: error
